name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt psutil scikit-learn pandas numpy fastapi uvicorn websockets msgpack pydantic PyYAML watchdog colorama
      - run: python -m pytest -q
      - run: node --check netpulse/web/app.js
      - run: node --check netpulse/web/sw.js
      - run: node --check netpulse/web/operations.js
      - run: node tests/frontend.cjs

  prometheus-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare validation secret
        run: mkdir -p deploy/observability/secrets && printf 'ci-placeholder' > deploy/observability/secrets/netpulse_metrics_token.txt
      - name: Validate Prometheus config and alert rules
        run: >-
          docker run --rm --entrypoint /bin/promtool
          -v "${{ github.workspace }}/deploy/observability/prometheus:/etc/prometheus:ro"
          -v "${{ github.workspace }}/deploy/observability/secrets/netpulse_metrics_token.txt:/run/secrets/netpulse_metrics_token:ro"
          prom/prometheus:v3.15.1 check config /etc/prometheus/prometheus.yml

  browser-and-monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt psutil scikit-learn pandas numpy fastapi uvicorn websockets msgpack pydantic PyYAML watchdog colorama
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: npx playwright install --with-deps chromium
      - name: Start isolated fixture
        run: NP_FIXTURE_HOST=0.0.0.0 NP_FIXTURE_PORT=8770 python tests/browser_server.py > /tmp/netpulse-fixture.log 2>&1 &
      - name: Wait for fixture readiness
        run: python -c "from tests.monitoring_smoke import eventually, request; eventually(lambda: request('http://127.0.0.1:8770/healthz'))"
      - run: npx playwright test tests/operations.spec.cjs --workers=1 --reporter=line
      - run: python tests/monitoring_smoke.py
      - name: Fixture diagnostics
        if: always()
        run: cat /tmp/netpulse-fixture.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
