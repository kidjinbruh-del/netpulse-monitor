name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt psutil scikit-learn pandas numpy fastapi uvicorn websockets msgpack pydantic PyYAML watchdog colorama
      - run: python -m pytest -q
      - run: node --check netpulse/web/app.js
      - run: node --check netpulse/web/sw.js
      - run: node tests/frontend.cjs
